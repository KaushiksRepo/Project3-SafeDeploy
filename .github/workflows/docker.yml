name: Build and Push Docker Image

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Docker Login
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Docker Image
      run: docker build -t ${{ secrets.DOCKER_USERNAME }}/safedeploy-app:v1 .

    - name: Push Docker Image
      run: docker push ${{ secrets.DOCKER_USERNAME }}/safedeploy-app:v1

    - name: Set up kubeconfig
      run: |
       mkdir -p ~/.kube
       echo "${{ secrets.KUBE_CONFIG_DATA }}" | base64 --decode > ~/.kube/config
       chmod 600 ~/.kube/config

    - name: Install kubectl
      run: |
       sudo apt-get update
       sudo apt-get install -y kubectl

    - name: Deploy to Kubernetes
      run: |
        kubectl set image deployment/smartdeploy-app app=${{ secrets.DOCKER_USERNAME }}/safedeploy-app:v1

    - name: Verify rollout
      run: |
        kubectl rollout status deployment/safedeploy-app:v1

    - name: Health Check
      run: |
       sleep 10
       curl -f http://4.224.98.56 || exit 1

    - name: Rollback if failed
      if: failure()
      run: |
       kubectl rollout undo deployment/smartdeploy-app   
